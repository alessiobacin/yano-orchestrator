<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Yano · Orchestrator Gantt</title><link rel="icon" href="data:,"><style>
:root{color-scheme:dark;--bg:#101820;--card:#17242e;--edge:#334554;--txt:#edf3f7;--muted:#a5b7c6;--accent:#8ddbc5}*{box-sizing:border-box;min-width:0}body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.5 system-ui}header,main{max-width:1440px;margin:auto;padding:24px 32px}header{border-bottom:1px solid var(--edge)}h1{font-size:32px;letter-spacing:-1px;margin:8px 0}h2{font-size:20px;margin:0 0 14px}h3{font-size:16px;margin:0 0 12px}.eyebrow{font:12px ui-monospace,monospace;color:var(--accent);letter-spacing:2px}.muted,small{color:var(--muted)}section{margin:24px 0 40px}.run{background:var(--card);border:1px solid var(--edge);padding:20px;margin-bottom:16px;border-radius:8px}.controls{display:flex;gap:16px;flex-wrap:wrap;align-items:center}select,button{font:inherit;background:var(--card);color:var(--txt);padding:8px 12px;border:1px solid var(--edge);border-radius:5px}.ticket{display:grid;grid-template-columns:60px minmax(0,1fr) minmax(130px,.4fr);gap:12px;padding:10px 0;border-bottom:1px solid var(--edge)}.badge{font:12px ui-monospace,monospace;padding:3px 6px;border:1px solid currentColor;display:inline-block;border-radius:3px}.status-done,.completed{color:#8ddbc5}.running,.status-running{color:#f2be70}.failed,.status-failed{color:#ff9090}.axis{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin:10px 0 10px 240px}.round{display:grid;grid-template-columns:220px minmax(0,1fr);gap:20px;margin:12px 0}.track{position:relative;background:repeating-linear-gradient(90deg,#223340 0,#223340 1px,transparent 1px,transparent 25%);min-height:40px;border-bottom:1px solid var(--edge)}.bar{position:absolute;top:8px;height:22px;border-radius:3px;background:#558e81;min-width:3px}.bar.running,.bar.dispatched{background:#9f7c3c;border-right:2px dashed #f2be70}.bar.failed{background:#a35454}.metadata{font-size:12px;overflow-wrap:anywhere;margin-top:4px}.phases{display:flex;gap:12px;flex-wrap:wrap}.phase{flex:1 1 170px;border:1px dashed var(--edge);padding:12px}.phase.complete{border-style:solid;color:var(--accent)}.empty{padding:24px;border:1px dashed var(--edge)}details{margin-top:8px}summary{cursor:pointer;color:var(--muted)}@media(max-width:650px){header,main{padding:18px}.round{grid-template-columns:minmax(0,1fr);gap:4px}.axis{margin-left:0}.ticket{grid-template-columns:40px minmax(0,1fr)}.ticket> :last-child{grid-column:2}.metadata{font-size:12px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style></head><body><header><div class="eyebrow">YANO / EXECUTION</div><h1 id="title">Orchestrator — Gantt</h1><div class="controls"><span id="connection" role="status">Caricamento…</span><label>Round <select id="filter"><option value="all">Tutti</option><option value="open">Senza esito</option><option value="completed">Completati</option></select></label><button id="refresh">Aggiorna</button></div></header><main id="root"></main><script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const time=s=>s?new Date(s).toLocaleString():'non osservato';
let snapshot, loading=false;
function waveMap(tickets,deps){const levels=new Map();for(let i=0;i<tickets.length;i++){let changed=false;for(const t of tickets){if(levels.has(t.id))continue;const parents=deps.filter(d=>d.ticket_id===t.id).map(d=>d.depends_on_id);if(parents.every(p=>levels.has(p))){levels.set(t.id,1+Math.max(0,...parents.map(p=>levels.get(p))));changed=true;}}if(!changed)break;}return levels;}
function render(s){snapshot=s;document.getElementById('title').textContent='Orchestrator — '+s.project;document.getElementById('connection').textContent='Aggiornato '+time(s.generated_at||new Date().toISOString());const root=document.getElementById('root');const expanded=new Map([...root.querySelectorAll('details[data-key]')].map(d=>[d.dataset.key,d.open]));if(!s.ok){root.innerHTML='<p class="empty">Stato non disponibile. '+esc(s.error||s.hint||'Nessun database del progetto.')+'</p>';return;}
const plans=(s.plans||[]).map(p=>'<details class="run" data-key="plan:'+esc(p.slug)+'" '+((p.phases||[]).every(f=>f.status==='complete')?'':'open')+'><summary><strong>'+esc(p.slug)+'</strong></summary><div class="phases">'+(p.phases||[]).map(f=>'<div class="phase '+esc(f.status)+'"><small>FASE '+esc(f.phase)+' · '+esc(f.status)+'</small><div>'+esc((f.roles||[]).join(' + '))+'</div><small>'+((f.models||[]).map(m=>esc(m.instance||m.role)+': '+esc(m.model)+' @ '+esc(m.provider)).join('<br>')||'Modelli previsti non dichiarati')+'</small></div>').join('')+'</div></details>').join('');
const tickets=(s.runs||[]).map(r=>{const levels=waveMap(r.tickets||[],r.dependencies||[]);return '<details class="run" data-key="run:'+esc(r.id)+'" '+(['done','completed','failed'].includes(r.status)?'':'open')+'><summary><strong>'+esc(r.objective)+'</strong> <span class="badge">'+esc(r.status)+'</span></summary>'+((r.open_holds||[]).length?'<p class="running">Attesa utente: '+esc(r.open_holds.map(h=>h.question).join(' · '))+'</p>':'')+(r.tickets||[]).slice().sort((a,b)=>(levels.get(a.id)||999)-(levels.get(b.id)||999)).map(t=>'<div class="ticket"><span class="muted">'+(levels.has(t.id)?'S'+levels.get(t.id):'?')+'</span><div>'+esc(t.title)+'<div class="metadata">Dipende da: '+esc((r.dependencies||[]).filter(d=>d.ticket_id===t.id).map(d=>(r.tickets.find(t=>t.id===d.depends_on_id)||{}).title||d.depends_on_id).join(', ')||'nessuno')+'</div></div><div class="status-'+esc(t.status)+'">'+esc(t.status)+'<div class="metadata">'+esc(t.assigned_instance||'agente da assegnare')+'</div></div></div>').join('')+'</details>';}).join('');
const filter=document.getElementById('filter').value;const rounds=(s.rounds||[]).filter(r=>filter==='all'||(filter==='open'?!r.ended_at:r.status==='completed'));
const starts=rounds.map(r=>Date.parse(r.started_at)).filter(Number.isFinite);const left=starts.length?Math.min(...starts):Date.now();const right=Math.max(left+1000,...rounds.map(r=>r.ended_at?Date.parse(r.ended_at):Date.now()).filter(Number.isFinite));const span=right-left;
const actual=rounds.map((r,i)=>{const start=Date.parse(r.started_at);const end=r.ended_at?Date.parse(r.ended_at):right;const x=Number.isFinite(start)?Math.max(0,(start-left)/span*100):0;const width=Number.isFinite(start)?Math.min(100-x,Math.max(.2,(end-start)/span*100)):0;return '<div class="round"><div><span class="badge '+esc(r.status)+'">'+esc(r.status)+'</span> <strong>'+esc(r.instance||'destinatario sconosciuto')+'</strong><div class="metadata">'+esc(r.role||'ruolo non osservato')+' · '+esc(r.sender||'mittente non osservato')+'</div><details data-key="round:'+esc(r.assignment_id)+'"><summary>Assignment '+esc(r.assignment_id.slice(-8))+'</summary><div class="metadata">'+esc(r.assignment_id)+'<br>Inizio: '+esc(time(r.started_at))+'<br>Esito: '+esc(time(r.ended_at))+'<br>'+((r.models||[]).map(m=>esc(m.model||'?')+' @ '+esc(m.provider||'?')+' ('+esc(m.source)+')').join('<br>')||'Modello/provider effettivi non osservati')+'</div></details></div><div><div class="track" aria-label="'+esc(r.instance)+' '+esc(r.status)+'"><div class="bar '+esc(r.status)+'" style="left:'+x+'%;width:'+width+'%"></div></div><div class="metadata">'+((r.models||[]).map(m=>esc(m.model)+' @ '+esc(m.provider)).join(' → ')||'Modello/provider non osservati')+'</div></div></div>';}).join('');
root.innerHTML='<section><h2>Sequenza prevista</h2><p class="muted">Fasi dichiarate e dipendenze. Stesso numero di sequenza = lavoro potenzialmente parallelo. Le durate future non sono stimate.</p>'+(plans||'')+(tickets||'<p class="empty">Nessun piano o ticket.</p>')+'</section><section><h2>Round osservati</h2><p class="muted">Un round corrisponde a un assignment. La barra aperta indica assenza di risposta conclusiva, non prova di attività continua. I modelli sono mostrati solo quando registrati.</p><div class="axis"><span>'+esc(time(new Date(left).toISOString()))+'</span><span>'+esc(time(new Date(right).toISOString()))+'</span></div>'+(actual||'<p class="empty">Nessun round nel trace disponibile.</p>')+'<p class="muted">Finestra: ultimi '+esc(s.evidence_limit||10000)+' eventi pertinenti. Eventi precedenti o tracing disabilitato possono lasciare lacune.</p></section>';for(const d of root.querySelectorAll('details[data-key]'))if(expanded.has(d.dataset.key))d.open=expanded.get(d.dataset.key);}
async function load(){if(loading)return;loading=true;try{const response=await fetch('/data');if(!response.ok)throw Error('HTTP '+response.status);render(await response.json());}catch(e){document.getElementById('connection').textContent='Aggiornamento fallito: '+e.message;}finally{loading=false;}}
document.getElementById('filter').onchange=()=>snapshot&&render(snapshot);document.getElementById('refresh').onclick=load;
try{const ws=new WebSocket((location.protocol==='https:'?'wss':'ws')+'://'+location.host+'/ws');ws.onmessage=e=>{try{render(JSON.parse(e.data));}catch{load();}};}catch{}
load();setInterval(load,5000);
</script></body></html>
