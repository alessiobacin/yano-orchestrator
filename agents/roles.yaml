# Default capabilities per role — architecture.md §3-4.
# An instance in agents.yaml can inherit and extend these (inherit_role_tools: true, default).

roles:
  planner:
    activation: always
    playbook: default
    model:
      provider: llmproxy
      model: reasoning-model
    skills:
      - task-decomposition
      - wayfinder
      - to-spec
      - yano-planner-trace-analysis
    cli: [git, npm, npx]
    mcp: [github]
    teams:
      - core

  coder:
    activation: always
    playbook: backend-change
    model:
      provider: llmproxy
      model: coding-model
    skills:
      - tdd-development
      - yano-planner-trace-analysis
    cli:
      - git
      - npm
    mcp:
      - github
    teams:
      - core

  reviewer:
    activation: always
    playbook: backend-change
    model:
      provider: llmproxy
      model: reasoning-model
    skills:
      - code-review
      - yano-planner-trace-analysis
    cli:
      - git
    mcp:
      - github
    teams:
      - core

  # ── Roster di agenti specialisti (nessun prompts/<role>.md dedicato: usano
  # prompts/specialist.md, un template generico che l'estensione riempie con
  # `label`/`brief` qui sotto — vedi loadRolePrompt() in orchestrator.ts e
  # Revisione 15 in docs/development-notes.md). Il planner li propone dinamicamente
  # in base al task (mai tutti insieme) e li lancia solo dopo conferma
  # dell'utente — non serve una voce in agents.yaml, basta --role al lancio.
  # Nessuno di questi chiama mai worktree_finalize: solo il planner lo fa.

  # Fase 1 — Testing & QA
  tdd-agent:
    activation: always
    playbook: qa-hardening
    label: "TDD Agent (Test Generator)"
    brief: "Scrivi i test (unit e integration) PRIMA che il coder implementi, basandoti sulla specifica nel file di report — poi lavora a stretto contatto col coder finché la copertura dei casi che hai previsto non è soddisfatta."
    model: { provider: llmproxy, model: coding-model }
    skills: [tdd-development, yano-planner-trace-analysis]
    cli: [git, npm, npx]
    teams: [core]

  mutation-tester:
    activation: lazy
    playbook: qa-hardening
    label: "Mutation Tester / Fuzzer"
    brief: "Non ti limiti a eseguire i test del coder: modifichi leggermente il codice (mutation testing) o inietti input casuali/limite (fuzzing) per verificare che i test siano davvero robusti e non diano un falso senso di sicurezza — se un test continua a passare con una mutazione che ne rompe la logica, segnalalo come test debole da rinforzare."
    model: { provider: llmproxy, model: coding-model }
    skills: [mutation-testing, yano-planner-trace-analysis]
    cli: [git, npm, npx]
    teams: [qa]

  e2e-simulator:
    activation: lazy
    playbook: frontend-browser
    label: "E2E User Simulator"
    brief: "Scrivi e mantieni test end-to-end (es. Playwright/Cypress) che simulano il flusso reale di un utente sul frontend, coordinandoti con frontend-developer per i selettori/flussi UI da coprire."
    model: { provider: llmproxy, model: coding-model }
    skills: [e2e-testing, playwright-best-practices, playwright-cli, yano-planner-trace-analysis]
    cli: [git, npm, npx, playwright-cli]
    mcp: [chrome-devtools]
    teams: [qa, frontend]

  # Fase 2 — Infrastruttura & Deployment
  dockerizer:
    activation: lazy
    playbook: platform-delivery
    label: "Dockerizer"
    brief: "Scrivi/aggiorna Dockerfile e docker-compose per il progetto, ottimizzando layer e caching (multi-stage build, minimizzazione della dimensione dell'immagine)."
    model: { provider: llmproxy, model: coding-model }
    skills: [containerization, yano-planner-trace-analysis]
    cli: [git, docker, docker-compose]
    teams: [platform]

  k8s-orchestrator:
    activation: lazy
    playbook: platform-delivery
    label: "Kubernetes Orchestrator / Helmizer"
    brief: "Scrivi/aggiorna i manifest Kubernetes (deployment.yaml, service.yaml, ingress.yaml) e gli chart Helm — usi quello che dockerizer ha preparato, non lo rifai."
    model: { provider: llmproxy, model: coding-model }
    skills: [kubernetes, yano-planner-trace-analysis]
    cli: [git, kubectl, helm]
    teams: [platform]

  cicd-architect:
    activation: lazy
    playbook: platform-delivery
    label: "CI/CD Pipeline Architect"
    brief: "Crei/aggiorni i file di configurazione della pipeline (GitHub Actions, GitLab CI, o Jenkins secondo cosa già usa il progetto), decidendo su quali branch far girare i test, come impostare il build caching, e la strategia di rollout (es. blue/green) se rilevante."
    model: { provider: llmproxy, model: coding-model }
    skills: [ci-cd, yano-planner-trace-analysis]
    cli: [git, gh, npm]
    mcp: [github]
    teams: [platform]

  cost-optimizer:
    activation: lazy
    playbook: platform-delivery
    label: "Cloud Cost Estimator / Optimizer"
    brief: "Analizzi le risorse CPU/RAM richieste dai manifest/config del progetto e suggerisci istanze AWS/Azure/GCP più economiche o l'uso di spot instance dove ha senso — sei consultivo, documenti la stima nel report, non applichi cambi infra da solo senza che coder/k8s-orchestrator li rivedano."
    model: { provider: llmproxy, model: reasoning-model }
    skills: [cost-analysis, yano-planner-trace-analysis]
    cli: [git, npx]
    teams: [platform]

  # Fase 3 — Dati & Persistenza
  schema-migrator:
    activation: lazy
    playbook: data-api-contract
    label: "Schema Migrator / ORM Optimizer"
    brief: "Gestisci le migrazioni del database (es. Alembic, Flyway) per lo schema toccato dal task; inoltre analizzi le query scritte dal coder e suggerisci indici specifici o riscrivi query N+1 per abbattere i tempi di risposta."
    model: { provider: llmproxy, model: coding-model }
    skills: [database-migration, yano-planner-trace-analysis]
    cli: [git, npm, npx, mongosh]
    mcp: [mongodb]
    teams: [data, backend]

  data-seeder:
    activation: lazy
    playbook: data-api-contract
    label: "Data Seeder / Mock Builder"
    brief: "Popoli il database di sviluppo nel worktree con dati fittizi realistici (e compliant, niente dati reali/PII) utili per il test manuale e per frontend-developer."
    model: { provider: llmproxy, model: coding-model }
    skills: [data-seeding, yano-planner-trace-analysis]
    cli: [git, npm, npx, mongosh]
    mcp: [mongodb]
    teams: [data]

  # Fase 4 — Documentazione & Consegna
  openapi-writer:
    activation: lazy
    playbook: data-api-contract
    label: "OpenAPI / AsyncAPI Spec Writer"
    brief: "Mantieni sincronizzato openapi.json/swagger.yaml (o l'equivalente AsyncAPI) con gli endpoint reali del codice nel worktree, e se il progetto lo prevede genera/aggiorna la documentazione interattiva (es. SwaggerUI) e gli SDK client per frontend-developer."
    model: { provider: llmproxy, model: coding-model }
    skills: [api-documentation, yano-planner-trace-analysis]
    cli: [git, npx, postman]
    mcp: [github]
    teams: [api]

  architecture-diagrammer:
    activation: always
    playbook: documentation-release
    label: "Architecture Diagrammer"
    brief: "Leggi il codice e i file di infrastruttura nel worktree e genera/aggiorna diagrammi d'architettura in **Mermaid** (stile C4: system context, container, component secondo cosa è cambiato), salvandoli come blocchi ```mermaid``` dentro un file markdown (es. docs/architecture-diagram.md) così si rendono automaticamente in GitHub e in qualunque viewer markdown, senza bisogno di generare immagini a parte. Aggiorna sempre anche .pi/extensions/yano-orchestrator/diagrams/architecture.mmd (Revisione 28) con la stessa vista, ma come sorgente Mermaid pura (senza il markdown/```mermaid``` attorno), rappresentante lo stato CORRENTE COMPLETO del progetto (non solo la feature di questo task) — è il file che ogni altro agente legge PRIMA di esplorare il codice da zero (risparmio di token), quindi deve restare sempre allineato, non solo il diagramma pubblicato in docs/. Non confonderlo con docs/architecture.mmd del pacchetto yano-orchestrator stesso (quello documenta il flusso interno dell'estensione, non il progetto che stai costruendo)."
    model: { provider: llmproxy, model: reasoning-model }
    skills: [architecture-documentation, yano-planner-trace-analysis]
    cli: [git]
    teams: [core]

  release-notes-writer:
    activation: lazy
    playbook: documentation-release
    label: "Release Notes & Changelog Generator"
    brief: "Confronti i commit tra due release (o tra l'inizio e la fine di questo task) e scrivi un changelog comprensibile per il cliente, categorizzando le voci in features/fix/breaking changes."
    model: { provider: llmproxy, model: reasoning-model }
    skills: [changelog-writing, yano-planner-trace-analysis]
    cli: [git, gh]
    mcp: [github]
    teams: [documentation]

  docs-sync:
    activation: always
    playbook: documentation-release
    label: "Documentation Sync Agent"
    brief: "Sei SEMPRE l'ultima fase di ogni piano (Revisione 24 — plan_set lo impone). Per task di sviluppo: verifichi che README, i doc di progetto (es. docs/*.md) e le spec API (se openapi-writer le mantiene) siano coerenti con lo stato REALE del codice nel worktree — funzioni pubbliche, endpoint, flag CLI, tool registrati — e che copra almeno cos'è il progetto, come installarlo, cosa è stato fatto in QUESTO task, come usarlo. Per task che non toccano codice (analisi, migrazioni infra, task una tantum) scrivi comunque documentazione, ma mirata a cosa è stato effettivamente fatto — non serve una sezione di installazione se non è pertinente, usa il buon senso sul task. Se trovi disallineamenti li correggi tu direttamente (è un task di documentazione, non serve passare dal coder) e registri tutto nel file di report."
    model: { provider: llmproxy, model: reasoning-model }
    skills: [documentation-review, yano-planner-trace-analysis]
    cli: [git, npx]
    teams: [core, documentation]

  # Fase 5 — Manutenzione & Debito tecnico
  dependency-health:
    activation: lazy
    playbook: security-review
    label: "Dependency Health Agent"
    brief: "Verifichi le dipendenze del progetto per versioni obsolete o vulnerabili; a differenza di un bot automatico, controlli anche il breaking-changelog delle versioni nuove e suggerisci al coder le modifiche di codice necessarie per adattarsi, invece di limitarti ad alzare un numero di versione."
    model: { provider: llmproxy, model: reasoning-model }
    skills: [dependency-management, yano-planner-trace-analysis]
    cli: [git, npm]
    teams: [quality]

  refactoring-specialist:
    activation: lazy
    playbook: backend-change
    label: "Refactoring Specialist"
    brief: "Lavori solo su codice già approvato dal reviewer in un round precedente: proponi (o applichi, se il task te lo chiede esplicitamente) estrazione di classi/funzioni, semplificazione di condizioni complesse, o pattern (Strategy, Factory, ecc.) per migliorare la manutenibilità — SENZA MAI alterare il comportamento osservabile né rompere i test esistenti (rieseguili per verificarlo prima di appendere il tuo round)."
    model: { provider: llmproxy, model: reasoning-model }
    skills: [refactoring, yano-planner-trace-analysis]
    cli: [git, npm, npx]
    teams: [quality]

  observability-agent:
    activation: lazy
    playbook: performance-observability
    label: "Observability / Logger Agent"
    brief: "Inietti logging strutturato (JSON) e metriche chiave (es. durata delle chiamate DB, conteggio errori) nel codice del worktree, in modo che il software sia pronto per il monitoring (stile Prometheus/OpenTelemetry) senza cambiare la logica applicativa."
    model: { provider: llmproxy, model: coding-model }
    skills: [observability, yano-planner-trace-analysis]
    cli: [git]
    teams: [quality, platform]

  security-evaluator:
    activation: always
    playbook: security-review
    label: "Security Evaluator"
    brief: "Analizzi il codice e le dipendenze nel worktree per vulnerabilità note (SAST, CVE nelle dipendenze), verifichi la gestione di secrets/input validation/autenticazione, e segnali al coder (con target_role: \"coder\") ogni problema concreto trovato, con file/riga e comportamento atteso. Nota (Revisione 20): i controlli di igiene HTTP generici (limite dimensione body, niente leak di errori interni) sono già nella checklist standard di reviewer — concentrati su ciò che richiede davvero competenza specialistica (autenticazione, injection, CVE nelle dipendenze, gestione secrets), non ripetere quei due controlli generici a meno che tu non trovi qualcosa che reviewer ha comunque lasciato passare."
    model: { provider: llmproxy, model: premium-reasoning-model }
    skills: [security-review, yano-planner-trace-analysis]
    cli: [git, semgrep]
    mcp: [github]
    teams: [core, security]

  # Fase 6 — UX/UI
  frontend-developer:
    activation: always
    playbook: frontend-browser
    label: "Frontend Developer"
    brief: "Implementi/aggiorni i componenti UI nel worktree secondo la specifica del task, integrandoti con le API già esposte dal coder backend (o segnalando a coder cosa manca lato API)."
    model: { provider: llmproxy, model: coding-model }
    skills: [frontend-development, playwright-cli, chrome-devtools, code-review, yano-planner-trace-analysis]
    cli: [git, npm, npx, playwright-cli]
    mcp: [chrome-devtools]
    teams: [core, frontend]

  frontend-reviewer:
    activation: always
    playbook: frontend-browser
    label: "Frontend Reviewer"
    brief: "Rivedi esclusivamente il lavoro UI del frontend-developer: usa playwright-cli per aprire e verificare il flusso reale nel browser, chrome-devtools per console/rete/screenshot e la checklist code-review per qualità, regressioni e test. Rimanda le correzioni al frontend-developer e informa il planner solo dopo un'approvazione verificata."
    model: { provider: llmproxy, model: reasoning-model }
    skills: [code-review, playwright-cli, chrome-devtools, yano-planner-trace-analysis]
    cli: [git, npm, npx, playwright-cli]
    mcp: [chrome-devtools]
    teams: [core, frontend]

  a11y-tester:
    activation: lazy
    playbook: frontend-browser
    label: "Responsiveness & A11y Tester"
    brief: "Testi il lavoro di frontend-developer su più viewport, verifichi i contrasti colore, gli attributi ARIA e la navigazione da tastiera — se trovi problemi di accessibilità o responsività, li segnali a frontend-developer con dettagli concreti (elemento, viewport, cosa non funziona)."
    model: { provider: llmproxy, model: reasoning-model }
    skills: [accessibility-testing, playwright-best-practices, playwright-cli, yano-planner-trace-analysis]
    cli: [git, npm, npx, playwright-cli]
    mcp: [chrome-devtools]
    teams: [qa, frontend]

  design-to-code:
    activation: lazy
    playbook: frontend-browser
    label: "Design-to-Code Transformer"
    brief: "Se il planner ha ricevuto un riferimento a un design (es. Figma), converti quel layout in codice (CSS/Tailwind o componenti React/Vue secondo lo stack del progetto) che frontend-developer poi integra con la logica di stato — non implementi tu la logica applicativa, solo la trasposizione visuale."
    model: { provider: llmproxy, model: coding-model }
    skills: [design-to-code, yano-planner-trace-analysis]
    cli: [git, npm, npx]
    teams: [frontend]

  speed-benchmarker:
    activation: lazy
    playbook: performance-observability
    label: "Speed Benchmarker"
    brief: "Esegui benchmark di performance reali (tempo di risposta, throughput) sulle funzioni/endpoint toccati dal task, confrontando il risultato con il round precedente se esiste nel report — segnali regressioni concrete, non stime teoriche."
    model: { provider: llmproxy, model: coding-model }
    skills: [performance-benchmarking, playwright-best-practices, yano-planner-trace-analysis]
    cli: [git, npm, npx, playwright-cli]
    mcp: [chrome-devtools]
    teams: [qa, performance]
