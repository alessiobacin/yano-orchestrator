schema_version: 1
id: clean-repo
label: Repository cleanup, reorganization and documentation completeness
description: >-
  Cleans a repository of files that are no longer needed, moves misplaced
  files into their proper directories, checks for now-dangling references
  left behind by any proposed removal or relocation, audits documentation
  completeness against a canonical set of documentation categories, and
  creates the missing documentation files with real content drawn from the
  repository it just audited. Before touching a single file — whether by
  deleting/moving it or by creating/updating a documentation file —
  repo-curator and docs-sync write one unified change-plan report (what
  would be removed, what would be relocated, what documentation would be
  created or updated, each justified) and the user must explicitly confirm
  it. Nothing is ever deleted, moved, created or updated on the auditing
  role's own judgment: only the items the user approves — the whole plan,
  a subset, or none — are ever executed.
catalog:
  scope: global
  reusable: true
  intents:
    - clean-repo
    - pulisci la repo
    - pulizia della repository
    - ripulisci la repo
    - riorganizza i file
    - riordina la repo
    - reorganize the repository
    - clean up the repository
    - remove unused files
    - rimuovi i file inutilizzati
    - file che non servono più
    - dangling reference
    - riferimenti non più esistenti
    - broken reference
    - documentazione mancante
    - missing documentation
    - documentazione non aggiornata
    - crea la documentazione mancante
    - repository hygiene
  exclusions:
    - single code refactor with no file reorganization
    - new feature implementation
    - comparison against another repository
    - new-content authoring unrelated to structural completeness
  parameters:
    - project_name
    - project_root
    - scope
    - has_backend
enforcement:
  status: partial
  note: The unified change-plan proposal (cleanup + documentation) and its
    explicit-approval gate before any deletion, relocation or documentation
    write, the dangling-reference scan and the canonical documentation
    categories are contractual; the runtime does not auto-detect unused
    files, backend presence or documentation gaps — repo-curator and
    docs-sync do, and the planner enforces the approval gate before
    applying_cleanup and before documenting.
contract:
  execution: sequential
  checkpoint: every_state_transition
  evidence:
    - scope
    - inputs
    - commands
    - exit_code
    - output
    - changed_state
    - blockers
  report_sections:
    - summary
    - scope
    - evidence
    - result
    - blockers
    - handoff
  budgets:
    max_commands: 80
    max_files: 200
    max_minutes: 45
    max_tokens: 16000
  verification:
    mode: maintenance
    required: true
  recovery:
    - resume_from_last_checkpoint
    - preserve_evidence
    - bounded_retry
states:
  - id: received
    owner: planner
    terminal: false
  - id: preflight
    owner: planner
    terminal: false
  - id: auditing
    owner: repo-curator
    terminal: false
  - id: awaiting_change_plan_confirmation
    owner: planner_and_human
    terminal: false
  - id: applying_cleanup
    owner: repo-curator
    terminal: false
  - id: documenting
    owner: docs-sync
    terminal: false
  - id: review
    owner: reviewer
    terminal: false
  - id: completed
    owner: planner
    terminal: true
  - id: blocked
    owner: planner_and_human
    terminal: true
transitions:
  - id: scope
    from: received
    to: preflight
    actor: planner
    requires:
      - objective_received
      - cleanup_scope_confirmed
  - id: start_audit
    from: preflight
    to: auditing
    actor: planner
    requires:
      - required_cli_skill_mcp_checked
      - phase_unlocked
  - id: present_change_plan
    from: auditing
    to: awaiting_change_plan_confirmation
    actor: repo-curator
    requires:
      - candidate_removal_list_justified_per_file
      - candidate_relocation_list_with_target_paths
      - dangling_reference_scan_completed_before_proposal
      - documentation_gap_report_against_canonical_categories
      - backend_detected_for_postman_requirement_or_explicitly_not_applicable
  - id: confirm_change_plan
    from: awaiting_change_plan_confirmation
    to: applying_cleanup
    actor: planner
    requires:
      - user_approved_or_edited_removal_and_relocation_list
      - user_approved_documentation_plan
  - id: skip_cleanup_confirm_documentation_only
    from: awaiting_change_plan_confirmation
    to: documenting
    actor: planner
    requires:
      - user_declined_all_removal_and_relocation_items
      - user_approved_documentation_plan
  - id: apply_and_reverify
    from: applying_cleanup
    to: documenting
    actor: repo-curator
    requires:
      - only_approved_items_executed
      - post_cleanup_reference_scan_clean_or_fixed
      - no_unapproved_deletion_or_move
  - id: submit_review
    from: documenting
    to: review
    actor: docs-sync
    requires:
      - missing_docs_created_in_canonical_categories
      - existing_docs_reconciled_with_current_repo_state
      - postman_collection_present_or_explicitly_not_applicable
  - id: accept
    from: review
    to: completed
    actor: planner
    requires:
      - reviewer_approved
      - cleanup_and_documentation_summary_in_final_report
      - docs_synced_or_skipped_with_reason
  - id: reject
    from: review
    to: blocked
    actor: reviewer
    requires:
      - concrete_findings
      - report_updated
  - id: block
    from: [auditing, awaiting_change_plan_confirmation, applying_cleanup, documenting]
    to: blocked
    actor: planner_and_human
    requires:
      - unresolved_blocker_or_ambiguous_deletion_target
      - report_updated
failure_routes:
  - condition: reference_broken_after_approved_move_or_deletion
    action: fix_reference_or_revert_the_specific_item_and_report
    terminal: false
  - condition: user_declines_specific_item_in_proposal
    action: remove_item_from_approved_list_and_continue_with_the_rest
    terminal: false
  - condition: user_requests_documentation_plan_revision
    action: revise_documentation_plan_and_represent_for_confirmation
    terminal: false
  - condition: ambiguous_whether_file_is_still_needed
    action: ask_user_instead_of_guessing
    terminal: false
  - condition: retry_budget_exhausted
    action: stop_and_escalate
    terminal: true
invariants:
  - id: isolated_worktree
    description: Same as backend-change/refactor — all work happens in an
      isolated worktree, never directly against the main checkout.
  - id: change_plan_proposed_and_confirmed_before_any_modification
    description: >-
      repo-curator and docs-sync never delete, relocate, create or update
      a single file during auditing. present_change_plan produces ONE
      unified report — the itemized removal/relocation list (each item
      justified) AND the documentation gap report against the canonical
      categories — and awaiting_change_plan_confirmation is the single
      gate the user confirms before any of it is executed: the whole
      plan, a subset, or none. confirm_change_plan requires explicit
      approval of both the cleanup list and the documentation plan, and
      skip_cleanup_confirm_documentation_only (chosen when the user
      declines every removal/relocation item) still requires explicit
      approval of the documentation plan before documenting begins — docs
      creation is never assumed pre-approved just because cleanup was
      declined or approved. Silence never counts as approval, and the
      user may request a revision instead (see
      user_requests_documentation_plan_revision and
      user_declines_specific_item_in_proposal).
  - id: dangling_reference_scan_before_and_after
    description: repo-curator scans for references (imports, doc links,
      config paths, CI workflow paths) to every candidate removal or
      relocation target BEFORE proposing it, to know in advance what would
      break, and AGAIN after applying the approved changes, to catch
      anything the pre-scan missed. A reference found broken after
      application is fixed or the specific change is reverted — never left
      dangling and never discovered only by the user later.
  - id: canonical_documentation_categories
    description: >-
      The documentation-completeness audit requires these exact canonical
      directories below `docs/`: `architecture/`, `guides/`,
      `quick-guides/`, `adr/`, `notes/`, `postman/` (when a backend exists),
      `cheat-sheet/`, and `diagram/`. A differently named or misplaced
      directory is a migration candidate, not a satisfied category:
      `quick_guides/` (underscore) must become `quick-guides/`, `diagramma/`
      must become `diagram/`. ZERO documents may remain directly below
      `docs/`: no `.md` (or other) file is allowed in the `docs/` root —
      every file is moved into its matching canonical category, or, when no
      canonical category fits, into a NEW folder with a pertinent name
      decided by repo-curator/docs-sync (never left in the root). Only an
      optional `docs/README.md` may remain directly below `docs/` as an
      index.
  - id: every_missing_category_gets_a_real_file
    description: >-
      A clean-repo documentation plan is itemized for every canonical
      category. If no directory or file exists, docs-sync creates the exact
      canonical directory and at least one real,
      useful file inside it: Markdown for architecture, guides, quick-guides,
      ADRs, notes and cheat-sheet; Mermaid source for diagram; and an
      importable Postman collection JSON when a backend is detected. Empty
      directories, TODO-only placeholders and generic invented examples do
      not satisfy the playbook. If no backend is detected, the plan and final
      report explicitly mark postman as not applicable and do not create it.
  - id: legacy_documentation_paths_are_migrated
    description: >-
      The plan lists every legacy documentation path and its canonical
      destination, moves files (not only directories) when a legacy folder
      mixes categories, and updates Markdown links, scripts, tests, CLI help
      and agent prompts after each move. A clean-repo run is incomplete while
      `docs/diagramma/`, `docs/quick_guides/` (underscore), root-level
      `docs/*` files other than an optional `docs/README.md`, or a root
      `postman/` directory remains without an explicitly approved exception.
      When a file is moved out of a legacy folder or the `docs/` root, every
      process/agent/skill/script/prompt/link that read or referenced it in
      the OLD location MUST be found and updated to the new path: the
      repository-wide reference scan is mandatory after the migration and
      any residual old-path reference found by grep is a failure unless
      explicitly documented as an allowed historical mention.
  - id: clean_repo_documentation_inventory_is_complete
    description: >-
      The repo-curator report and the docs-sync closing report list all eight
      categories (including postman applicability), the existing equivalent
      path or the concrete path/file created, and the evidence used to derive
      the content. README existence alone never closes a documentation gap.
  - id: missing_docs_are_real_not_placeholders
    description: A documentation file docs-sync creates to fill a gap
      reflects the actual current repository — real commands, real
      endpoints, a real mermaid diagram of the real flow — never a
      templated stub with TODOs standing in for content docs-sync could
      have written directly from the repo it just audited.
  - id: reviewer_required_for_code
  - id: no_finalize_before_explicit_user_confirmation
  - id: cleanup_and_documentation_summary_in_final_report
    description: The closing report lists what was actually removed, what
      was relocated (old path -> new path), what documentation files were
      created or updated, and any proposed item the user declined — a
      complete accounting, never just "cleanup done".
