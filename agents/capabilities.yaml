# Canonical capability registry used by `yano deps --role` and CI linting.
# Roles may still declare project-specific skills/MCPs, but executable probes
# belong here so the same command and version signal is used everywhere.
schema_version: 1

capabilities:
  rg:
    kind: cli
    command: rg
    probe: [--version]
  node:
    kind: cli
    command: node
    probe: [--version]
  git:
    kind: cli
    command: git
    probe: [--version]
  npm:
    kind: cli
    command: npm
    probe: [--version]
  npx:
    kind: cli
    command: npx
    probe: [--version]
  herdr:
    kind: cli
    command: herdr
    probe: [--version]
  yano:
    kind: cli
    command: yano
    probe: [--version]
  gh:
    kind: cli
    command: gh
    probe: [--version]
  docker:
    kind: cli
    command: docker
    probe: [--version]
  docker-compose:
    kind: cli
    command: docker
    probe: [compose, version]
  kubectl:
    kind: cli
    command: kubectl
    probe: [version, --client=true]
  helm:
    kind: cli
    command: helm
    probe: [version]
  mongosh:
    kind: cli
    command: mongosh
    probe: [--version]
  postman:
    kind: cli
    command: postman
    probe: [--version]
  playwright-cli:
    kind: cli
    command: playwright-cli
    probe: [--version]
  semgrep:
    kind: cli
    command: semgrep
    probe: [--version]
  curl:
    kind: cli
    command: curl
    probe: [--version]

# Declarative MCP catalog used by the toolchain-readiness audit. Presence here
# means "known capability", not "reachable now"; the audit must still probe it.
mcp_capabilities:
  chrome-devtools:
    purpose: browser inspection and UI diagnostics
    optional: true
  agentation:
    purpose: visual annotation intake
    optional: true
  github:
    purpose: repository and issue evidence
    optional: true
  stitch:
    purpose: UI design exploration
    optional: true
  mongodb:
    purpose: database inspection
    optional: true
