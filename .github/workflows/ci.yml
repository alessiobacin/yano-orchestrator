name: CI

# Esegue la suite di verifica reale di questo repo (non solo lint/build) a
# ogni push/PR — richiesto dall'operatore prima di rendere pubblico questo
# repo (vedi docs/development-notes.md, Revisione 31). Nessuno di questi step
# richiede la CLI `pi` reale: check-syntax.mjs e tutti gli
# script/smoke-test-*.mjs + e2e-full-flow.mjs sono pensati apposta per
# essere eseguibili con solo Node, un broker MQTT locale, e (per gli script
# che importano/eseguono per davvero extensions/orchestrator.ts) lo stub
# locale di @mariozechner/pi-tui — vedi scripts/setup-dev-stubs.mjs.

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Recreate local @mariozechner/pi-tui stub (dev/test only — see scripts/setup-dev-stubs.mjs)
        run: npm run setup-dev-stubs

      - name: Install and start a local mosquitto broker
        run: |
          sudo apt-get update
          sudo apt-get install -y mosquitto
          nohup mosquitto -c mqtt/mosquitto.native.conf > /tmp/mosquitto.log 2>&1 &
          disown
          for i in $(seq 1 20); do
            (echo > /dev/tcp/127.0.0.1/1883) >/dev/null 2>&1 && echo "mosquitto up" && exit 0
            sleep 0.5
          done
          echo "mosquitto never came up"; cat /tmp/mosquitto.log; exit 1

      - name: Full test suite (static checks, every smoke test and real E2E)
        run: npm test

      - name: yano CLI smoke test (init in place + start --print-only, via a real global install)
        run: |
          npm install -g .
          mkdir -p /tmp/yano-ci-test && cd /tmp/yano-ci-test
          yano init --name "CI Test Project"
          # Revisione 33: create-project.mjs stopped copying extensions/ into
          # scaffolded projects (the code loads from the global install
          # instead) — this used to assert extensions/orchestrator.ts, which
          # a post-Revisione-33 scaffold never has; assert what's actually
          # guaranteed to exist instead.
          test -f agents/roles.yaml
          test -f .pi/extensions/multiAgentOrchestrator/config/project.json
          test ! -e extensions/orchestrator.ts
          # Revisione 49: create-project.mjs also copies a .mcp.json.example
          # template (chrome-devtools MCP server, for reviewer/frontend-developer)
          # — never an active .mcp.json, same principle as .env.example/.env.
          test -f .mcp.json.example
          test ! -e .mcp.json
          # Revisione 47: `yano init` no longer creates a local prompts/ copy at
          # all — role prompts are always read from the global install by
          # default (see extensions/orchestrator.ts, resolveGlobalPromptsDir()).
          test ! -e .pi/extensions/multiAgentOrchestrator/prompts
          yano start --instance planner-01 --print-only | grep -q -- "--role planner"
          yano end | grep -q -- "niente da chiudere"
          # Revisione 47: `yano copy-prompts` materializes a local copy to
          # customize, then `--custom-prompts` is what actually makes an
          # instance read it (exercised for real in
          # scripts/smoke-test-custom-prompts.mjs above) — here we just
          # confirm the CLI round-trip against the real global `yano` binary.
          yano copy-prompts | grep -q -- "copiati"
          test -f .pi/extensions/multiAgentOrchestrator/prompts/planner.md
          echo "CUSTOMIZED-CI-MARKER" > .pi/extensions/multiAgentOrchestrator/prompts/planner.md
          yano copy-prompts | grep -q -- "copia locale precedente"
          grep -q -- "CUSTOMIZED-CI-MARKER" .pi/extensions/multiAgentOrchestrator/prompts.bak-*/planner.md
          ! grep -q -- "CUSTOMIZED-CI-MARKER" .pi/extensions/multiAgentOrchestrator/prompts/planner.md
