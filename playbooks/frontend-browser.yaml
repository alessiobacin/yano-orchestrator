---
schema_version: 1
id: frontend-browser
label: Frontend implementation and browser review
description: Frontend flow using frontend-developer and
  frontend-reviewer with two-axis Spec/Standards review, an explicit
  e2e-simulator verification step, Playwright CLI and Chrome DevTools
  evidence; backend reviewer is not substituted.
enforcement:
  status: partial
  note: Browser commands are recorded as evidence by the planner;
    runtime does not guess application URLs.
contract:
  execution: sequential
  checkpoint: every_state_transition
  evidence:
    - scope
    - inputs
    - commands
    - exit_code
    - output
    - changed_state
    - blockers
  report_sections:
    - summary
    - scope
    - evidence
    - result
    - blockers
    - handoff
  budgets:
    max_commands: 80
    max_files: 200
    max_minutes: 45
    max_tokens: 16000
  verification:
    mode: delivery
    required: true
  recovery:
    - resume_from_last_checkpoint
    - preserve_evidence
    - bounded_retry
states:
  - id: received
    owner: planner
    terminal: false
  - id: preflight
    owner: planner
    terminal: false
  - id: implementing
    owner: frontend-developer
    terminal: false
  - id: browser_review
    owner: frontend-reviewer
    terminal: false
  - id: e2e_verification
    owner: e2e-simulator
    terminal: false
  - id: completed
    owner: planner
    terminal: true
  - id: blocked
    owner: planner_and_human
    terminal: true
transitions:
  - id: scope
    from: received
    to: preflight
    actor: planner
    requires:
      - objective_received
      - spec_created
      - frontend_scope_defined
  - id: start_frontend
    from: preflight
    to: implementing
    actor: planner
    requires:
      - playwright_cli_available
      - chrome_devtools_available
      - phase_one_unlocked
  - id: submit_browser_review
    from: implementing
    to: browser_review
    actor: frontend-developer
    requires:
      - frontend_tests_run
      - screenshot_or_trace_recorded
      - frontend_sent_to_frontend_reviewer
      - spec_reviewed
      - frontend_standards_reviewed
      - review_findings_classified
  - id: start_e2e_verification
    from: browser_review
    to: e2e_verification
    actor: planner
    requires:
      - frontend_reviewer_approved
      - console_and_network_checked
      - test_accounts_ready_or_explicit_block_recorded
      - e2e_required_or_skip_reason_recorded
  - id: submit_e2e_verification
    from: e2e_verification
    to: completed
    actor: planner
    requires:
      - e2e_tests_run_or_explicit_skip_reason
      - e2e_evidence_recorded
      - test_accounts_ready_or_explicit_block_recorded
      - agentation_review_offered_or_not_applicable
      - docs_synced_or_skipped_with_reason
  - id: accept
    from: e2e_verification
    to: completed
    actor: planner
    requires:
      - frontend_reviewer_approved
      - console_and_network_checked
      - e2e_tests_run_or_explicit_skip_reason
      - agentation_review_offered_or_not_applicable
      - docs_synced_or_skipped_with_reason
  - id: reject
    from: browser_review
    to: blocked
    actor: frontend-reviewer
    requires:
      - concrete_browser_finding
      - report_updated
failure_routes:
  - condition: browser_unreachable
    action: report_url_and_environment_blocker
    terminal: false
  - condition: accessibility_regression
    action: return_to_frontend_developer
    terminal: false
invariants:
  - frontend_reviewer_is_separate_from_backend_reviewer
  - spec_and_standards_are_reported_separately
  - code_smells_are_heuristics_not_automatic_blockers
  - snapshot_first
  - no_fixed_waits_when_web_assertion_exists
  - ui_affecting_tasks_require_e2e_or_explicit_skip_reason
  - authenticated_e2e_requires_test_accounts_or_explicit_block
  - agentation_review_is_offered_before_frontend_finalize
  - no_finalize_before_explicit_user_confirmation
