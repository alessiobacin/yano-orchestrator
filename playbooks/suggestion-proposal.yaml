schema_version: 1
id: suggestion-proposal
label: Suggestion proposal
description: Lifecycle read-only per raccogliere e proporre suggerimenti utenti al planner dopo approvazione.
enforcement:
  status: partial
  note: La CLI applica persistenza, deduplicazione e gate di approvazione; il worker deve rispettare il contratto della skill.
states:
  - id: received
    owner: suggester
    terminal: false
  - id: deduplicated
    owner: suggester
    terminal: false
  - id: triaged
    owner: suggester
    terminal: false
  - id: analyzing
    owner: suggester
    terminal: false
  - id: proposed
    owner: suggester
    terminal: false
  - id: awaiting_approval
    owner: superadmin
    terminal: false
  - id: accepted
    owner: planner
    terminal: true
  - id: rejected
    owner: planner
    terminal: true
  - id: duplicate
    owner: suggester
    terminal: true
  - id: blocked
    owner: planner_and_human
    terminal: true
transitions:
  - from: received
    id: deduplicate
    to: deduplicated
    actor: suggester
    requires:
      - fingerprint_created
  - from: deduplicated
    id: triage
    to: triaged
    actor: suggester
    requires:
      - provenance_valid
  - from: triaged
    id: analyze
    to: analyzing
    actor: suggester
    requires:
      - evidence_pack_available
  - from: analyzing
    id: propose
    to: proposed
    actor: suggester
    requires:
      - report_complete
  - from: analyzing
    id: mark_duplicate
    to: duplicate
    actor: suggester
    requires:
      - duplicate_confirmed
  - from: proposed
    id: request_approval
    to: awaiting_approval
    actor: suggester
    requires:
      - human_gate
  - from: awaiting_approval
    id: approve
    to: accepted
    actor: planner
    requires:
      - superadmin_approval
  - from: awaiting_approval
    id: reject
    to: rejected
    actor: planner
    requires:
      - rejection_reason
  - from: awaiting_approval
    id: block
    to: blocked
    actor: planner
    requires:
      - missing_context
failure_routes:
  - condition: unsafe_or_secret_bearing_input
    action: redact_and_block
    terminal: true
  - condition: project_unavailable
    action: preserve_submission_and_block
    terminal: true
invariants:
  - id: external_agent_read_only
    description: The external agent never mutates the reference project.
  - id: no_planner_handoff_before_approval
    description: The planner receives an operational handoff only after approval.
  - id: project_key_isolation
    description: Suggestions and evidence remain isolated by project key.
