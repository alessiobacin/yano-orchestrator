# Default capabilities per role — architecture.md §3-4.
# An instance in agents.yaml can inherit and extend these (inherit_role_tools: true, default).

roles:
  planner:
    activation: always
    playbook: default
    model:
      provider: llmproxy
      model: llmproxy
    skills:
      - task-decomposition
      - wayfinder
      - to-spec
      - to-tickets
      - yano-planner-trace-analysis
      - yano-cli
    cli: [git, npm, npx]
    mcp: [github]
    teams:
      - core

  coder:
    activation: always
    playbook: backend-change
    model:
      provider: llmproxy
      model: llmproxy
    model_diversity:
      must_differ_from: reviewer
      reason: "Independent implementation perspective: a coder must never share the reviewer's exact pinned LLM."
    skills:
      - tdd-development
      - yano-planner-trace-analysis
      - yano-cli
    cli:
      - git
      - npm
    mcp:
      - github
    teams:
      - core

  reviewer:
    activation: always
    playbook: backend-change
    model:
      provider: llmproxy
      model: llmproxy
    model_diversity:
      must_differ_from: coder
      reason: "Independent critical review: a reviewer must never share the coder's exact pinned LLM."
    skills:
      - code-review
      - yano-code-review
      - yano-planner-trace-analysis
      - yano-cli
    cli:
      - git
    mcp:
      - github
    teams:
      - core

  debugger:
    activation: always
    playbook: observer-audit
    label: "Yano Debugger"
    brief: "Gestisci bug applicativi in modo esclusivamente diagnostico: raccogli il contesto trace, riproduci senza modificare il progetto, redigi evidenze e inoltra la diagnosi al planner. Non correggere codice, test o configurazioni e non fare deploy."
    model:
      provider: llmproxy
      model: llmproxy
    skills:
      - yano-observer
      - yano-planner-trace-analysis
      - yano-cli
    cli: [git, npm, npx, curl]
    mcp: []
    teams:
      - debugger
      - quality

  auto-improver:
    activation: lazy
    playbook: observer-audit
    label: "Yano Auto-Improver"
    brief: "Esegui audit periodici read-only del progetto: correlando codice, test, documentazione, trace, bug e feedback produci raccomandazioni prioritizzate e inviale al planner. Non modificare mai il progetto, non creare ticket operativi autonomamente e non eseguire deploy."
    model:
      provider: llmproxy
      model: llmproxy
    skills:
      - yano-observer
      - yano-auto-improvement
      - yano-planner-trace-analysis
      - yano-cli
    cli: [git, npm, npx, curl]
    mcp: []
    teams:
      - improvement
      - quality

  suggester:
    activation: lazy
    playbook: suggestion-proposal
    label: "Yano Suggester"
    brief: "Raccogli e analizza suggerimenti utenti in modo esclusivamente read-only: deduplica, valuta valore/rischio/complessità, redigi una proposta e attendi l'approvazione del superadmin prima di notificare il planner. Non modificare il progetto, non creare ticket operativi e non fare deploy."
    model:
      provider: llmproxy
      model: llmproxy
    skills:
      - yano-observer
      - yano-suggester
      - yano-planner-trace-analysis
      - yano-cli
    cli: [git, npm, npx, curl]
    mcp: []
    teams:
      - suggestions
      - quality

  watcher:
    activation: lazy
    playbook: observer-audit
    label: "Yano Watcher"
    brief: "Osserva un progetto e il round di validazione di un playbook in modo esclusivamente read-only. Usa yano watch e il trace per rilevare stall, target offline, errori di routing o capability non rispettate; comunica evidenze al planner e non modificare mai codice, test, configurazioni, dati, ticket operativi o deployment del progetto osservato."
    model:
      provider: llmproxy
      model: llmproxy
    skills:
      - yano-observer
      - yano-planner-trace-analysis
      - yano-cli
    cli: [git, node, yano, herdr]
    mcp: []
    teams:
      - observer
      - quality

  deployment-agent:
    activation: lazy
    playbook: deployment-delivery
    label: "Deployment Agent"
    brief: "Esegui il percorso controllato development → staging → production: verifica lo stack reale, assegna e conserva la matrice di porte Yano, lascia development sul codice sorgente, dockerizza staging e production, valida healthcheck/smoke test, conserva digest e rollback checkpoint e non promuove production senza approvazione esplicita."
    model:
      provider: llmproxy
      model: llmproxy
    skills:
      - yano-deployment
      - yano-planner-trace-analysis
      - yano-cli
    cli: [git, npm, npx, docker, docker-compose, curl]
    mcp: []
    teams:
      - platform
      - deployment

  architect:
    activation: lazy
    playbook: architect-provisioning
    label: "Yano Architect"
    brief: "Progetta e prepara playbook e ruoli specialistici nel catalogo globale Yano. Verifica e, quando autorizzato, provvisiona skill, CLI e MCP; non modificare mai il progetto di riferimento. Un playbook resta non operativo finché tutte le capability richieste non risultano verificate. Gestisci revisioni ephemeral e promozione persistente solo dopo validazione del watcher e feedback positivo del planner/utente."
    model:
      provider: llmproxy
      model: llmproxy
    skills:
      - yano-architect
      - yano-planner-trace-analysis
      - yano-cli
    cli: [git, node, npm, npx, herdr]
    mcp: []
    teams:
      - architecture
      - platform

  market-researcher:
    activation: lazy
    playbook: knowledge-authoring
    label: "Market Researcher"
    brief: "Ricerca mercato, audience, competitor e fonti per un playbook globale di knowledge authoring. Produce solo report intermedi e non modifica i documenti finali."
    model: { provider: llmproxy, model: llmproxy }
    skills: [research, documentation-lookup, yano-planner-trace-analysis, yano-cli]
    cli: [git, npx]
    mcp: []
    teams: [knowledge, research]

  conversation-researcher:
    activation: lazy
    playbook: conversation
    label: "Conversation Researcher"
    brief: "Fornisci al planner un consulto read-only, circoscritto e verificabile durante una conversazione. Non creare worktree, run, ticket o artefatti di sviluppo e non modificare il progetto."
    model: { provider: llmproxy, model: llmproxy }
    skills: [documentation-lookup, yano-planner-trace-analysis, yano-cli]
    cli: [yano]
    mcp: []
    teams: [conversation, research]

  seo-strategist:
    activation: lazy
    playbook: knowledge-authoring
    label: "SEO Strategist"
    brief: "Definisci search intent, keyword, opportunità SEO e information architecture. Scrivi solo gli artefatti SEO intermedi assegnati."
    model: { provider: llmproxy, model: llmproxy }
    skills: [research, documentation-lookup, copywriting, yano-planner-trace-analysis, yano-cli]
    cli: [git, npx]
    mcp: []
    teams: [knowledge, research]

  website-content-strategist:
    activation: lazy
    playbook: knowledge-authoring
    label: "Website Content Strategist"
    brief: "Trasforma ricerca e SEO in posizionamento, messaging, struttura del sito e content brief senza scrivere il deliverable finale."
    model: { provider: llmproxy, model: llmproxy }
    skills: [copywriting, documentation-writer, yano-planner-trace-analysis, yano-cli]
    cli: [git, npx]
    mcp: []
    teams: [knowledge, strategy]

  business-docs-author:
    activation: lazy
    playbook: knowledge-authoring
    label: "Business Docs Author"
    brief: "Sintetizza gli input approvati in documenti Markdown business completi e strutturati. È l'unico ruolo autorizzato a scrivere i documenti finali in docs/."
    model: { provider: llmproxy, model: llmproxy }
    skills: [documentation-writer, documentation-lookup, copywriting, yano-planner-trace-analysis, yano-cli]
    cli: [git, npx]
    mcp: []
    teams: [knowledge, authoring]

  business-docs-reviewer:
    activation: lazy
    playbook: knowledge-authoring
    label: "Business Docs Reviewer"
    brief: "Revisiona tracciabilità delle fonti, coerenza, duplicazioni, completezza e rispetto del template senza modificare direttamente i deliverable finali."
    model: { provider: llmproxy, model: llmproxy }
    skills: [documentation-writer, documentation-lookup, yano-planner-trace-analysis, yano-cli]
    cli: [git, npx]
    mcp: []
    teams: [knowledge, quality]

  # ── Roster di agenti specialisti (di norma nessun prompts/<role>.md dedicato:
  # prompts/specialist.md, un template generico che l'estensione riempie con
  # `label`/`brief` qui sotto — vedi loadRolePrompt() in orchestrator.ts e
  # Revisione 15 in docs/notes/development-notes.md). Il planner li propone dinamicamente
  # in base al task (mai tutti insieme) e li lancia secondo il contratto del
  # playbook — non serve una voce in agents.yaml, basta --role al lancio.
  # Nessuno di questi chiama mai worktree_finalize: solo il planner lo fa.

  # Fase 1 — Testing & QA
  tdd-agent:
    activation: always
    playbook: qa-hardening
    label: "TDD Agent (Test Generator)"
    brief: "Scrivi i test (unit e integration) PRIMA che il coder implementi, basandoti sulla specifica nel file di report — poi lavora a stretto contatto col coder finché la copertura dei casi che hai previsto non è soddisfatta."
    model: { provider: llmproxy, model: llmproxy }
    skills: [tdd-development, yano-planner-trace-analysis, yano-cli]
    cli: [git, npm, npx]
    teams: [core]

  mutation-tester:
    activation: lazy
    playbook: qa-hardening
    label: "Mutation Tester / Fuzzer"
    brief: "Non ti limiti a eseguire i test del coder: modifichi leggermente il codice (mutation testing) o inietti input casuali/limite (fuzzing) per verificare che i test siano davvero robusti e non diano un falso senso di sicurezza — se un test continua a passare con una mutazione che ne rompe la logica, segnalalo come test debole da rinforzare."
    model: { provider: llmproxy, model: llmproxy }
    skills: [mutation-testing, yano-planner-trace-analysis, yano-cli]
    cli: [git, npm, npx]
    teams: [qa]

  qa-inventory-analyst:
    activation: lazy
    playbook: qa-full-audit
    label: "QA Inventory Analyst"
    brief: "Costruisci la matrice canonica di tutte le funzionalità, i comandi, gli endpoint e le opzioni dichiarati dal progetto target (README, guide, --help reale, command-reference, spec, e per Yano stesso anche playbook/roles/skill) e per ciascuna voce fissa il risultato atteso (output, exit code, effetto collaterale, invariante) prima che qa-functional-verifier esegua qualunque test — non esegui tu i comandi, scrivi il contratto verificabile."
    model: { provider: llmproxy, model: llmproxy }
    skills: [documentation-lookup, yano-planner-trace-analysis, yano-cli]
    cli: [git, npm, npx]
    teams: [qa]

  qa-functional-verifier:
    activation: lazy
    playbook: qa-full-audit
    label: "QA Functional Verifier"
    brief: "Esegui davvero, in worktree/sandbox isolata e mai su dati o ambienti di produzione, ogni voce della matrice di qa-inventory-analyst — confronta atteso vs osservato con evidenza riproducibile (comando, exit code, output) e classifica PASS/FAIL/BLOCKED. Coordina in parallelo gli specialisti già esistenti pertinenti (security-evaluator, e2e-simulator, a11y-tester, speed-benchmarker, dependency-health, mutation-tester) invece di duplicarne il lavoro, e dopo ogni ciclo di remediation riesegui l'INTERA matrice, non solo le voci corrette, prima di dichiarare il gate verde."
    model: { provider: llmproxy, model: llmproxy }
    skills: [tdd-development, yano-planner-trace-analysis, yano-cli]
    cli: [git, npm, npx, curl]
    teams: [qa]

  debater:
    activation: lazy
    playbook: debate
    label: "Debater"
    brief: "Argomenta la posizione/stance assegnata dal planner sul topic del dibattito in modo indipendente nel turno di apertura, senza vedere gli argomenti degli altri debater; nel turno di replica rispondi nel merito ai loro argomenti con la stessa onestà intellettuale che useresti in una code review — obietta con motivazioni concrete, non per partito preso, e dichiara se un controargomento ti ha davvero convinto a cambiare posizione."
    model: { provider: llmproxy, model: llmproxy }
    skills: [documentation-lookup, yano-planner-trace-analysis, yano-cli]
    cli: [git]
    teams: [debate]

  e2e-simulator:
    activation: lazy
    playbook: frontend-browser
    label: "E2E User Simulator"
    brief: "Scrivi e mantieni test end-to-end (es. Playwright/Cypress) che simulano il flusso reale di un utente sul frontend, coordinandoti con frontend-developer per i selettori/flussi UI da coprire."
    model: { provider: llmproxy, model: llmproxy }
    skills: [e2e-testing, playwright-best-practices, playwright-cli, yano-planner-trace-analysis, yano-cli]
    cli: [git, npm, npx, playwright-cli]
    mcp: [chrome-devtools]
    teams: [qa, frontend]

  # Fase 2 — Infrastruttura & Deployment
  dockerizer:
    activation: lazy
    playbook: platform-delivery
    label: "Dockerizer"
    brief: "Scrivi/aggiorna Dockerfile e docker-compose per il progetto, ottimizzando layer e caching (multi-stage build, minimizzazione della dimensione dell'immagine)."
    model: { provider: llmproxy, model: llmproxy }
    skills: [containerization, yano-planner-trace-analysis, yano-cli]
    cli: [git, docker, docker-compose]
    teams: [platform]

  k8s-orchestrator:
    activation: lazy
    playbook: platform-delivery
    label: "Kubernetes Orchestrator / Helmizer"
    brief: "Scrivi/aggiorna i manifest Kubernetes (deployment.yaml, service.yaml, ingress.yaml) e gli chart Helm — usi quello che dockerizer ha preparato, non lo rifai."
    model: { provider: llmproxy, model: llmproxy }
    skills: [kubernetes, yano-planner-trace-analysis, yano-cli]
    cli: [git, kubectl, helm]
    teams: [platform]

  cicd-architect:
    activation: lazy
    playbook: platform-delivery
    label: "CI/CD Pipeline Architect"
    brief: "Crei/aggiorni i file di configurazione della pipeline (GitHub Actions, GitLab CI, o Jenkins secondo cosa già usa il progetto), decidendo su quali branch far girare i test, come impostare il build caching, e la strategia di rollout (es. blue/green) se rilevante."
    model: { provider: llmproxy, model: llmproxy }
    skills: [ci-cd, yano-planner-trace-analysis, yano-cli]
    cli: [git, gh, npm]
    mcp: [github]
    teams: [platform]

  cost-optimizer:
    activation: lazy
    playbook: platform-delivery
    label: "Cloud Cost Estimator / Optimizer"
    brief: "Analizzi le risorse CPU/RAM richieste dai manifest/config del progetto e suggerisci istanze AWS/Azure/GCP più economiche o l'uso di spot instance dove ha senso — sei consultivo, documenti la stima nel report, non applichi cambi infra da solo senza che coder/k8s-orchestrator li rivedano."
    model: { provider: llmproxy, model: llmproxy }
    skills: [cost-analysis, yano-planner-trace-analysis, yano-cli]
    cli: [git, npx]
    teams: [platform]

  # Fase 3 — Dati & Persistenza
  schema-migrator:
    activation: lazy
    playbook: data-api-contract
    label: "Schema Migrator / ORM Optimizer"
    brief: "Gestisci le migrazioni del database (es. Alembic, Flyway) per lo schema toccato dal task; inoltre analizzi le query scritte dal coder e suggerisci indici specifici o riscrivi query N+1 per abbattere i tempi di risposta."
    model: { provider: llmproxy, model: llmproxy }
    skills: [database-migration, yano-planner-trace-analysis, yano-cli]
    cli: [git, npm, npx, mongosh]
    mcp: [mongodb]
    teams: [data, backend]

  data-seeder:
    activation: lazy
    playbook: data-api-contract
    label: "Data Seeder / Mock Builder"
    brief: "Popoli il database di sviluppo nel worktree con dati fittizi realistici (e compliant, niente dati reali/PII) utili per il test manuale e per frontend-developer."
    model: { provider: llmproxy, model: llmproxy }
    skills: [data-seeding, yano-planner-trace-analysis, yano-cli]
    cli: [git, npm, npx, mongosh]
    mcp: [mongodb]
    teams: [data]

  # Fase 4 — Documentazione & Consegna
  openapi-writer:
    activation: lazy
    playbook: data-api-contract
    label: "OpenAPI / AsyncAPI Spec Writer"
    brief: "Mantieni sincronizzato openapi.json/swagger.yaml (o l'equivalente AsyncAPI) con gli endpoint reali del codice nel worktree, e se il progetto lo prevede genera/aggiorna la documentazione interattiva (es. SwaggerUI) e gli SDK client per frontend-developer."
    model: { provider: llmproxy, model: llmproxy }
    skills: [api-documentation, yano-planner-trace-analysis, yano-cli]
    cli: [git, npx, postman]
    mcp: [github]
    teams: [api]

  architecture-diagrammer:
    activation: always
    playbook: documentation-release
    label: "Architecture Diagrammer"
    brief: "Leggi il codice e i file di infrastruttura nel worktree e genera/aggiorna diagrammi d'architettura in **Mermaid** (stile C4: system context, container, component secondo cosa è cambiato), salvandoli come blocchi ```mermaid``` dentro un file markdown (es. docs/architecture-diagram.md) così si rendono automaticamente in GitHub e in qualunque viewer markdown, senza bisogno di generare immagini a parte. Aggiorna sempre anche .pi/extensions/yano-orchestrator/diagrams/architecture.mmd (Revisione 28) con la stessa vista, ma come sorgente Mermaid pura (senza il markdown/```mermaid``` attorno), rappresentante lo stato CORRENTE COMPLETO del progetto (non solo la feature di questo task) — è il file che ogni altro agente legge PRIMA di esplorare il codice da zero (risparmio di token), quindi deve restare sempre allineato, non solo il diagramma pubblicato in docs/. Non confonderlo con docs/architecture/architecture.mmd del pacchetto yano-orchestrator stesso (quello documenta il flusso interno dell'estensione, non il progetto che stai costruendo)."
    model: { provider: llmproxy, model: llmproxy }
    skills: [architecture-documentation, yano-planner-trace-analysis, yano-cli]
    cli: [git]
    teams: [core]

  release-notes-writer:
    activation: lazy
    playbook: documentation-release
    label: "Release Notes & Changelog Generator"
    brief: "Confronti i commit tra due release (o tra l'inizio e la fine di questo task) e scrivi un changelog comprensibile per il cliente, categorizzando le voci in features/fix/breaking changes."
    model: { provider: llmproxy, model: llmproxy }
    skills: [changelog-writing, yano-planner-trace-analysis, yano-cli]
    cli: [git, gh]
    mcp: [github]
    teams: [documentation]

  docs-sync:
    activation: always
    playbook: documentation-release
    label: "Documentation Sync Agent"
    brief: "Sei SEMPRE l'ultima fase di ogni piano (Revisione 24 — plan_set lo impone). Per task di sviluppo: verifichi che README, i doc di progetto e le spec API siano coerenti con lo stato REALE del codice nel worktree. A OGNI invocazione devi verificare e sincronizzare questi percorsi canonici: docs/architecture/, docs/guides/, docs/quick-guides/, docs/adr/, docs/notes/, docs/postman/ (se esiste un backend), docs/cheat-sheet/ e docs/diagram/. Le directory legacy `quick_guides/` (underscore) e `diagramma/` NON soddisfano il requisito nel playbook clean-repo: vanno migrate ai percorsi canonici. È VIETATO lasciare documenti in root docs/: ogni file direttamente sotto docs/ va classificato e spostato nella categoria canonica pertinente OPPURE, se nessuna categoria canonica calza, in un nuovo folder con nome pertinente deciso da te (mai lasciarlo in root); al massimo può restare un eventuale docs/README.md come indice. Dopo ogni spostamento cerca i riferimenti (processi, agenti, skill, script, prompt, link md, CLI help) che puntavano al vecchio percorso e aggiornali al nuovo; la scansione repository-wide dei riferimenti obsoleti è obbligatoria prima di chiudere il round. Se una categoria applicabile è assente, crea la directory canonica e almeno un file con contenuto reale ricavato dal repository; non lasciare directory vuote, placeholder o TODO. Tutte le categorie sono obbligatorie tranne postman: se il progetto non espone alcun backend/API, per esempio una chat di sola consultazione, dichiara postman non applicabile nel report e non creare la directory; con un backend la collection Postman JSON è obbligatoria. Il diagramma deve essere Mermaid e descrivere il flusso logico reale."
    model: { provider: llmproxy, model: llmproxy }
    skills: [documentation-review, yano-planner-trace-analysis, yano-cli]
    cli: [git, npx]
    teams: [core, documentation]

  scheduler:
    activation: lazy
    playbook: default
    label: "Recurring Job Scheduler"
    brief: "Trasforma richieste ricorrenti approvate dall'utente in job Yano tracciati. Usa solo `yano schedule add` con una root di progetto esplicita, una cron a cinque campi e un task testuale; non incorpora shell arbitraria. Spiega sempre che il job avvierà un planner e non bypasserà gate di sicurezza o approvazioni umane. Puoi elencare, disabilitare o rimuovere solo job Yano identificati dal loro id."
    model: { provider: llmproxy, model: llmproxy }
    skills: [yano-cli, yano-planner-trace-analysis]
    cli: [yano]
    mcp: []
    teams: [automation, core]

  # Fase 5 — Manutenzione & Debito tecnico
  dependency-health:
    activation: lazy
    playbook: security-review
    label: "Dependency Health Agent"
    brief: "Verifichi le dipendenze del progetto per versioni obsolete o vulnerabili; a differenza di un bot automatico, controlli anche il breaking-changelog delle versioni nuove e suggerisci al coder le modifiche di codice necessarie per adattarsi, invece di limitarti ad alzare un numero di versione."
    model: { provider: llmproxy, model: llmproxy }
    skills: [dependency-management, yano-planner-trace-analysis, yano-cli]
    cli: [git, npm]
    teams: [quality]

  refactoring-specialist:
    activation: lazy
    playbook: refactor
    label: "Refactoring Specialist"
    brief: "Lavori solo su codice già approvato dal reviewer in un round precedente: proponi (o applichi, se il task te lo chiede esplicitamente) estrazione di classi/funzioni, semplificazione di condizioni complesse, o pattern (Strategy, Factory, ecc.) per migliorare la manutenibilità — SENZA MAI alterare il comportamento osservabile né rompere i test esistenti (rieseguili per verificarlo prima di appendere il tuo round)."
    model: { provider: llmproxy, model: llmproxy }
    skills: [refactor, yano-planner-trace-analysis, yano-cli]
    cli: [git, npm, npx]
    teams: [quality]

  repo-curator:
    activation: lazy
    playbook: clean-repo
    label: "Repo Curator"
    brief: "Costruisci un elenco puntuale di file candidati alla rimozione (con una motivazione concreta per ciascuno: non referenziato da nessuna parte, artefatto generato committato per errore, superato da un altro file, ecc.) e un elenco di file da spostare nella directory corretta con il percorso di destinazione proposto. Prima di proporre qualunque rimozione o spostamento, verifica ogni riferimento (import, link nella documentazione, path in config/CI) che punta al file candidato, per sapere in anticipo cosa si romperebbe. Durante l'audit documentale devi elencare, una per una, architecture, guides, quick-guides, adr, notes, postman se c'è un backend, cheat-sheet e diagram, indicando per ciascuna directory/file equivalente trovato oppure il percorso e il file reale da creare. Non considerare sufficiente una directory vuota o un semplice elenco nel report: il piano deve permettere a docs-sync di creare contenuto concreto. Rileva esplicitamente la presenza o assenza del backend e, in caso positivo, la necessità della collection Postman JSON. Non cancellare né spostare MAI nulla di tua iniziativa: il tuo elenco è solo una proposta finché l'utente non approva esplicitamente, in tutto o in parte. Dopo aver eseguito solo le voci approvate, ripeti la scansione dei riferimenti per verificare che nulla sia rimasto rotto."
    model: { provider: llmproxy, model: llmproxy }
    skills: [documentation-lookup, yano-planner-trace-analysis, yano-cli]
    cli: [git, npm, npx]
    teams: [repo-hygiene]

  repo-benchmarker:
    activation: lazy
    playbook: get-the-best-from
    label: "Repo Benchmarker"
