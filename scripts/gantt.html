<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Yano · Attività del progetto</title><link rel="icon" href="data:,"><style>
:root{color-scheme:dark;--bg:#101820;--card:#17242e;--edge:#334554;--text:#edf3f7;--muted:#a5b7c6;--mint:#8ddbc5;--amber:#f2be70;--red:#ff9090}*{box-sizing:border-box;min-width:0}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 system-ui}header,main{max-width:1600px;margin:auto;padding:24px 32px}header{border-bottom:1px solid var(--edge)}.eyebrow{font:12px ui-monospace,monospace;letter-spacing:2px;color:var(--mint)}h1{font-size:34px;letter-spacing:-1px;margin:8px 0}h2{font-size:20px;margin:0 0 12px}h3{font-size:15px;margin:0 0 6px}p{margin:8px 0}.muted,small{color:var(--muted)}.path{overflow-wrap:anywhere;font:12px ui-monospace,monospace}.toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:end;margin:20px 0}.toolbar label{display:grid;gap:5px;flex:1 1 160px}.toolbar label.assignment{flex:2 1 260px}select,input,button{font:inherit;background:var(--card);color:var(--text);padding:9px 12px;border:1px solid var(--edge);border-radius:6px;width:100%}button{width:auto;cursor:pointer}select:focus,input:focus,button:focus{outline:2px solid var(--mint);outline-offset:2px}.overview{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin:0 0 30px}.panel{background:var(--card);border:1px solid var(--edge);border-radius:10px;padding:18px}.panel.now{border-top:3px solid var(--mint)}.panel.next{border-top:3px dashed var(--amber)}.panel.done{border-top:3px solid #62798a}.summary-item{padding:10px 0;border-top:1px solid var(--edge);overflow-wrap:anywhere}.badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;border:1px solid var(--edge);padding:3px 8px;border-radius:20px;color:var(--muted)}.badge.working{color:var(--mint);border-color:var(--mint)}.badge.failed{color:var(--red)}.badge.completed{color:var(--mint)}.badge.unconfirmed,.badge.waiting,.badge.awaiting_response{color:var(--amber)}.pulse{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--mint);animation:pulse 1.4s ease-in-out infinite}.project{font-size:11px;color:var(--mint);letter-spacing:.4px}.model{font-size:12px;margin-top:6px;overflow-wrap:anywhere}.model strong{color:var(--text)}.legend{display:flex;gap:16px;flex-wrap:wrap;color:var(--muted);margin:12px 0}.legend span::before{content:'';display:inline-block;width:16px;height:7px;background:#4c8b7a;margin-right:6px}.legend .pending::before{background:transparent;border:1px dashed var(--amber)}.timeline-head,.timeline-row{display:grid;grid-template-columns:minmax(240px,1fr) minmax(180px,.7fr) minmax(280px,1.3fr);gap:20px}.timeline-head{font-size:12px;color:var(--muted);padding:12px 16px;border-bottom:1px solid var(--edge)}.timeline-row{padding:18px 16px;border-bottom:1px solid var(--edge);align-items:start}.timeline-row:hover{background:#17242e}.timeline-row h3{font-size:15px;line-height:1.5;overflow-wrap:anywhere;margin-top:6px}.identity{color:var(--muted);font-size:12px;margin:6px 0}.axis{display:flex;justify-content:space-between;gap:8px}.track{height:34px;position:relative;background:repeating-linear-gradient(90deg,#33455466 0,#33455466 1px,transparent 1px,transparent 25%);border-bottom:1px solid var(--edge);margin:10px 0}.bar{position:absolute;top:7px;height:18px;border-radius:4px;background:#4c8b7a;min-width:3px}.bar.unconfirmed,.bar.awaiting_response,.bar.waiting{background:#716044;border:1px dashed var(--amber)}.bar.failed{background:#a45454}.bar.working{background:linear-gradient(110deg,#458976 20%,#a3ead1 50%,#458976 80%);background-size:200% 100%;animation:flow 2s linear infinite}.now-marker{position:absolute;right:0;height:34px;border-right:1px solid var(--mint)}.time-label{font-size:11px;color:var(--muted)}.empty{padding:22px;border:1px dashed var(--edge);color:var(--muted);border-radius:8px}details{margin:10px 0}summary{cursor:pointer;color:var(--muted);font-size:12px}.detail{padding:12px;background:var(--bg);border:1px solid var(--edge);overflow-wrap:anywhere;font-size:12px}.steps{margin:8px 0;padding-left:20px;color:var(--muted)}section{margin-bottom:32px}.plan{margin:12px 0;padding:16px;border:1px solid var(--edge);border-radius:8px}.sequence{display:flex;gap:12px;overflow:auto;padding:10px 0}.stage{flex:1 0 210px;max-width:350px;border:1px dashed var(--edge);padding:14px;border-radius:6px}.stage small{color:var(--amber)}.stage .summary-item{border:0;padding:5px 0}.count{font:12px ui-monospace,monospace;color:var(--muted)}@keyframes pulse{50%{opacity:.35;box-shadow:0 0 0 5px #8ddbc51c}}@keyframes flow{to{background-position:-200% 0}}@media(max-width:950px){.overview{grid-template-columns:1fr}.timeline-head{display:none}.timeline-row{grid-template-columns:minmax(0,1fr)}.timeline-row>div{min-width:0}header,main{padding:20px}}@media(prefers-reduced-motion:reduce){.pulse,.bar.working{animation:none}}
</style></head><body>
<header><div class="eyebrow">YANO / ATTIVITÀ DEL PROGETTO</div><h1 id="project">Caricamento progetto…</h1><div class="path" id="project-root"></div><p class="muted">Chi sta lavorando, su cosa e con quale modello. Il passato è temporale; i prossimi passi seguono le dipendenze.</p><div id="connection" role="status" class="count">Connessione…</div></header>
<main><div class="toolbar"><label>Periodo<select id="period"><option value="1">Ultime 24 ore</option><option value="7">Ultimi 7 giorni</option><option value="all">Tutta la storia disponibile</option></select></label><label class="assignment">Assignment / lavoro<select id="assignment"><option value="all">Tutti i lavori</option></select></label><label>Stato<select id="filter"><option value="all">Tutti</option><option value="working">In corso adesso</option><option value="completed">Conclusi</option><option value="open">Senza risposta conclusiva</option></select></label><label>Cerca<input id="search" type="search" placeholder="Descrizione, agente, modello…"></label><button id="refresh">Aggiorna</button></div><div id="root"></div></main>
<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const time=s=>s?new Date(s).toLocaleString('it-IT'):'non registrato';
const statusNames={working:'In corso adesso',completed:'Concluso',failed:'Fallito',unconfirmed:'Attività non confermata',waiting:'In attesa',awaiting_response:'In attesa di risposta',dispatched:'Inviato',running:'Attività non confermata',unknown:'Stato non registrato'};
const badge=r=>'<span class="badge '+esc(r.display_status||r.status)+'">'+(r.live?'<i class="pulse" aria-hidden="true"></i>':'')+esc(statusNames[r.display_status||r.status]||r.status)+'</span>';
let snapshot,loading=false;
function modelText(r){if((r.models||[]).length)return r.models.map(m=>'<div class="model"><strong>'+esc(m.model||'Modello non registrato')+'</strong><br>Provider: '+esc(m.provider||'non registrato')+'<br><small>'+esc(m.source==='provider_reported_header'?'Dichiarato nella risposta del provider':'Metadata della risposta')+'</small></div>').join('');return '<div class="model">Modello effettivo non registrato'+((r.routing||[]).length?'<br><small>Routing configurato: '+r.routing.map(m=>esc(m.model)+' · '+esc(m.provider||'?')).join(' → ')+'</small>':'')+'</div>';}
function waveMap(tickets,deps){const levels=new Map();for(let i=0;i<tickets.length;i++){let changed=false;for(const t of tickets){if(levels.has(t.id))continue;const parents=deps.filter(d=>d.ticket_id===t.id).map(d=>d.depends_on_id);if(parents.every(p=>levels.has(p))){levels.set(t.id,1+Math.max(0,...parents.map(p=>levels.get(p))));changed=true;}}if(!changed)break;}return levels;}
function brief(r){return '<div class="summary-item"><div class="project">'+esc(r.project||snapshot.project)+'</div><strong>'+esc(r.title)+'</strong><div class="identity">'+esc(r.instance||'Destinatario da identificare')+' · '+esc(r.role||'ruolo non registrato')+'</div>'+badge(r)+(r.live&&r.steps?.length?'<p class="identity">Ultima azione: '+esc(r.steps.at(-1).tool)+'</p>':'')+modelText(r)+'</div>';}
function render(s){snapshot=s;document.title=s.project+' · Yano attività';document.getElementById('project').textContent='Progetto: '+s.project;document.getElementById('project-root').textContent=s.root||s.db_path||'';document.getElementById('connection').textContent='Aggiornato '+time(s.generated_at);const root=document.getElementById('root');if(!s.ok){root.innerHTML='<div class="empty">'+esc(s.error||s.hint||'Dati non disponibili')+'</div>';return;}
const expanded=new Set([...root.querySelectorAll('details[open]')].map(d=>d.dataset.key));
const selection=document.getElementById('assignment'),selected=selection.value;
selection.innerHTML='<option value="all">Tutti i lavori</option>'+(s.rounds||[]).slice().reverse().map(r=>'<option value="'+esc(r.assignment_id)+'">'+esc(r.title.slice(0,110))+' · '+esc(r.instance)+' · '+esc(time(r.started_at))+'</option>').join('');selection.value=[...selection.options].some(o=>o.value===selected)?selected:'all';
const period=document.getElementById('period').value,filter=document.getElementById('filter').value,query=document.getElementById('search').value.toLowerCase();
const all=(s.rounds||[]).filter(r=>(selection.value==='all'||r.assignment_id===selection.value)&&(!query||[r.title,r.instance,r.project,r.assignment_id,...(r.models||[]).flatMap(m=>[m.model,m.provider])].join(' ').toLowerCase().includes(query)));
const rounds=all.filter(r=>(selection.value!=='all'||period==='all'||Date.parse(r.ended_at||r.last_activity_at||r.started_at)>Date.now()-Number(period)*86400000||r.live)&&(filter==='all'||(filter==='open'?!r.ended_at:filter==='working'?r.live:r.status==='completed')));
const live=all.filter(r=>r.live);const finished=all.filter(r=>r.ended_at).slice(-3).reverse();
const pending=(s.runs||[]).filter(r=>!['done','completed','failed','cancelled'].includes(r.status)).flatMap(run=>(run.tickets||[]).filter(t=>!['done','completed','failed','cancelled'].includes(t.status)).map(t=>({...t,run})));
const next=pending.filter(t=>(t.run.dependencies||[]).filter(d=>d.ticket_id===t.id).every(d=>['done','completed'].includes(t.run.tickets.find(x=>x.id===d.depends_on_id)?.status)));
const overview='<div class="overview"><section class="panel now"><h2>Ora <span class="count">'+live.length+' in corso</span></h2>'+(live.map(brief).join('')||'<p class="muted">Nessun lavoro in esecuzione confermato.</p><small>Una sessione aperta o una risposta mancante non significa che l’LLM stia lavorando.</small>')+'</section><section class="panel next"><h2>Prossimi passi</h2>'+(next.slice(0,3).map(t=>'<div class="summary-item"><div class="project">'+esc(s.project)+'</div><strong>'+esc(t.title)+'</strong><div class="identity">'+esc(t.assigned_instance||'Agente da assegnare')+' · '+esc(t.run.objective)+'</div><span class="badge">'+(t.run.open_holds?.length?'Attesa conferma utente':'Dipendenze soddisfatte')+' · '+esc(t.status)+'</span></div>').join('')||'<p class="muted">Nessun ticket pronto dichiarato.</p>')+'<small>Previsioni dai ticket, non un avvio garantito.</small></section><section class="panel done"><h2>Ultimi lavori conclusi</h2>'+(finished.map(brief).join('')||'<p class="muted">Nessuna conclusione registrata.</p>')+'</section></div>';
const starts=rounds.map(r=>Date.parse(r.started_at)).filter(Number.isFinite),ends=rounds.map(r=>Date.parse(r.ended_at||r.last_activity_at||r.started_at)).filter(Number.isFinite);const right=Math.max(...ends,live.length?Date.now():0,1),left=starts.length?Math.min(...starts):right-3600000,span=Math.max(right-left,1000);
const actual=rounds.slice().reverse().map(r=>{const start=Date.parse(r.started_at),end=r.live?Date.now():Date.parse(r.ended_at||r.last_activity_at||r.started_at);const x=Math.min(99.5,Math.max(0,(start-left)/span*100))||0,width=Math.min(100-x,Math.max(.4,(end-start)/span*100))||.4;return '<article class="timeline-row" data-assignment="'+esc(r.assignment_id)+'"><div><div class="project">PROGETTO '+esc(r.project||s.project)+'</div><h3>'+esc(r.title)+'</h3><div class="identity">'+esc(r.sender||'Utente / avvio diretto')+' → <strong>'+esc(r.instance||'Destinatario non registrato')+'</strong> · '+esc(r.role||'')+'</div>'+badge(r)+(r.run_title?'<div class="identity">Piano: '+esc(r.run_title)+'</div>':'')+'</div><div>'+modelText(r)+'</div><div><div class="track"><div class="bar '+esc(r.display_status)+'" style="left:'+x+'%;width:'+width+'%" role="img" aria-label="'+esc(r.title+' — '+(statusNames[r.display_status]||r.status))+'"></div>'+(r.live?'<div class="now-marker"></div>':'')+'</div><div class="time-label">'+esc(time(r.started_at))+' → '+esc(r.live?'adesso':r.ended_at?time(r.ended_at):'ultima evidenza '+time(r.last_activity_at||r.started_at))+'</div><details data-key="'+esc(r.assignment_id)+'"><summary>Attività e dettagli tecnici</summary><div class="detail">'+(r.title_source==='response_summary'?'Titolo ricavato dalla risposta storica, non dalla richiesta originale.<br>':'')+'Assignment: '+esc(r.assignment_id)+'<br>Turni LLM registrati: '+esc(r.turns||0)+(r.model_note?'<p>'+esc(r.model_note)+'</p>':'')+(!r.ended_at&&!r.live?'<p>Conclusione non registrata. La barra si ferma all’ultima evidenza, non si estende fino a oggi.</p>':'')+'<ol class="steps">'+(r.steps||[]).map(step=>'<li>'+esc(time(step.at))+' · '+esc(step.tool)+' · '+esc({started:'avviato',completed:'terminato',failed:'errore'}[step.state])+'</li>').join('')+'</ol></div></details></div></article>';}).join('');
const plans=(s.runs||[]).filter(r=>(r.tickets||[]).some(t=>!['done','completed','failed','cancelled'].includes(t.status))).map(run=>{const levels=waveMap(run.tickets||[],run.dependencies||[]);const groups=[...new Set([...levels.values()])].sort((a,b)=>a-b);return '<div class="plan"><h3>'+esc(run.objective)+'</h3>'+((run.open_holds||[]).length?'<p class="badge waiting">Attesa utente: '+esc(run.open_holds.map(h=>h.question).join(' · '))+'</p>':'')+'<div class="sequence">'+groups.map(n=>'<div class="stage"><small>PASSO '+n+' '+(n>1?'→ dopo i precedenti':'')+'</small>'+run.tickets.filter(t=>levels.get(t.id)===n).map(t=>'<div class="summary-item"><strong>'+esc(t.title)+'</strong><div class="identity">'+esc(t.assigned_instance||'Agente da assegnare')+' · '+esc(t.status)+'</div></div>').join('')+'</div>').join('')+'</div></div>';}).join('');
const phases=(s.plans||[]).filter(p=>p.phases?.some(f=>f.status!=='complete')).map(p=>'<details class="plan" data-key="plan:'+esc(p.slug)+'"><summary>Fasi e modelli previsti: '+esc(p.slug)+'</summary><div class="sequence">'+p.phases.map(f=>'<div class="stage"><small>FASE '+esc(f.phase)+' · '+esc(f.status)+'</small><h3>'+esc((f.roles||[]).join(' + '))+'</h3>'+((f.models||[]).map(m=>'<div class="model">Previsto: '+esc(m.model)+'<br>Provider: '+esc(m.provider)+'</div>').join('')||'<small>Modello previsto non dichiarato</small>')+'</div>').join('')+'</div></details>').join('');
root.innerHTML=overview+'<section><h2>Timeline del lavoro <span class="count">'+rounds.length+' risultati</span></h2><div class="legend"><span>Intervallo osservato</span><span class="pending">Risposta mancante / attività non confermata</span></div><div class="timeline-head"><span>Lavoro · progetto · agente</span><span>Modello e provider effettivi</span><div class="axis"><span>'+esc(time(new Date(left).toISOString()))+'</span><span>'+esc(time(new Date(right).toISOString()))+'</span></div></div>'+(actual||'<div class="empty">Nessun lavoro per questi filtri. Scegli un assignment o amplia il periodo.</div>')+'</section><section><h2>Sequenza prevista</h2><p class="muted">Ordine dei ticket e fasi dichiarate. Le attività nello stesso passo possono procedere in parallelo. Nessuna durata futura stimata.</p>'+(plans||'<div class="empty">Nessun ticket futuro dichiarato.</div>')+phases+'</section><small>Vista del solo progetto '+esc(s.project)+'. Finestra: '+esc(s.evidence_limit||10000)+' eventi di lavoro e attività degli strumenti nelle ultime 24 ore. Il grafico mostra eventi osservabili, non il ragionamento interno dell’LLM.</small>';
for(const d of root.querySelectorAll('details[data-key]'))if(expanded.has(d.dataset.key))d.open=true;
}
async function load(){if(loading)return;loading=true;try{const response=await fetch('/data');if(!response.ok)throw Error('HTTP '+response.status);render(await response.json());}catch(e){document.getElementById('connection').textContent='Aggiornamento fallito: '+e.message;}finally{loading=false;}}
for(const id of ['period','assignment','filter'])document.getElementById(id).onchange=()=>snapshot&&render(snapshot);document.getElementById('search').oninput=()=>snapshot&&render(snapshot);document.getElementById('refresh').onclick=load;load();setInterval(load,5000);
</script></body></html>
